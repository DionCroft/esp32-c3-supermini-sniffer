; ESP32-C3 SuperMini - passive 2.4 GHz 802.11 sniffer / channel analyser (MVP)
;
; Bare SuperMini (native USB-Serial-JTAG). One radio does two jobs:
;   1) open a softAP serving the web dashboard (data/index.html via LittleFS)
;   2) promiscuous capture on that same channel (channel 6)
; No extra modules, no internet, no cloud.
;
; NOTE: "esp32c3" is the chip/MCU name, not a PlatformIO board ID. Board IDs are
; derived from the board file name (esp32-c3-devkitc-02.json -> esp32-c3-devkitc-02),
; so we target the official Espressif C3 dev board: 160 MHz, 4 MB flash,
; native USB-Serial-JTAG, Wi-Fi+BT, BOOT button on GPIO9 - a faithful match for
; the bare ESP32-C3 SuperMini target; physical board/flash remains unverified.

[env:esp32c3]
platform           = espressif32@6.11.0
board              = esp32-c3-devkitc-02
framework          = arduino
monitor_speed      = 115200
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
upload_protocol    = esptool
board_build.filesystem = littlefs
platform_packages  = framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
build_flags        = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
